<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/main.ts"></script>
    <title>WyvernJS</title>
  </head>
  <body>
    <div w-scope="{a: 0}">
      <p w-text="a"></p>
      <p w-computed:double="() => a*2" w-text="double"></p>
      <button type="button" w-on:click="() => a++">inc</button>
    </div>
  </body>
</html>
